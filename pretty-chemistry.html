<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pretty Chemistry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f7f2f3;--ink:#2b2226;--muted:#6f6269;--card:#fff;--chip:#ece3e6;--glass:rgba(255,255,255,.58);--on:#2b2226;--onink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(38,29,33,.6);--bg:#1a1417;--ink:#f4eaee;--muted:#b3a3aa;--card:#261d21;--chip:#352a2f;--on:#f4eaee;--onink:#1a1417}}
:root[data-theme="dark"]{--glass:rgba(38,29,33,.6);--bg:#1a1417;--ink:#f4eaee;--muted:#b3a3aa;--card:#261d21;--chip:#352a2f;--on:#f4eaee;--onink:#1a1417}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);text-decoration:none;font:500 12px 'DM Mono',ui-monospace,monospace;letter-spacing:.06em}
.back:hover{color:var(--ink)}
header{padding:36px 20px 8px;max-width:1100px;margin:0 auto}
h1{font:600 clamp(42px,9vw,76px)/.95 'Cormorant Garamond',Georgia,serif;margin:0 0 12px;letter-spacing:.01em}
header p{margin:0;color:var(--muted);max-width:44ch;font:italic 500 21px/1.35 'Cormorant Garamond',Georgia,serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 20px;max-width:1100px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:8px 16px;border-radius:999px;font:500 12px 'DM Mono',ui-monospace,monospace;letter-spacing:.06em}
.chip[aria-pressed="true"]{background:#d6456f;color:#fff}
.chip:focus-visible,.save:focus-visible{outline:3px solid #e0527a;outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:8px 20px 56px;columns:3 260px;column-gap:16px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;break-inside:avoid;margin:0 0 18px;background:var(--c);border-radius:28px;overflow:hidden;box-shadow:0 10px 26px -14px color-mix(in srgb,var(--c) 90%,#6b2a45)}
.pic{position:absolute;inset:0;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 75%);color:#2b2226;overflow:hidden}
.pic::before{content:"";position:absolute;right:-45px;top:-45px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.35)}
.pic::after{content:"";position:absolute;left:-35px;bottom:-55px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22)}
.pic>div{position:relative;z-index:1}
.card.t1{aspect-ratio:3/4;--f:55%}.card.t2{aspect-ratio:2/3;--f:45%}.card.t3{aspect-ratio:3/4.4;--f:46%}
.pic .e{position:absolute;right:16px;top:16px;z-index:1;width:60px;height:60px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.6);font-size:30px;line-height:1}
.pic h2{margin:0;font:600 34px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em}
.pic small{display:block;font:400 11px 'DM Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.72;margin-top:6px}
.save{z-index:2;position:absolute;left:12px;top:12px;border:0;background:rgba(255,255,255,.8);color:#2b2226;width:36px;height:36px;border-radius:50%;font-size:18px}
.pic.has-img{background-size:cover;background-position:center;color:#fff}
.pic.has-img::before{display:none}
.pic.has-img::after{display:none}
.pic.has-img h2,.pic.has-img small{text-shadow:0 1px 8px rgba(0,0,0,.25)}
.body{position:relative;z-index:1;margin:0;padding:72px 22px 22px;--t:color-mix(in srgb,var(--c) 22%,#2a1f25);color:var(--t);background:linear-gradient(to bottom,rgba(255,255,255,0),color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.42)) 60%);text-shadow:0 0 10px rgba(255,255,255,.6)}
.body::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;-webkit-backdrop-filter:blur(9px) saturate(1.15);backdrop-filter:blur(9px) saturate(1.15);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 45%);mask-image:linear-gradient(to bottom,transparent 0,#000 45%)}
.body h2{margin:0;font:600 32px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em}
.body small{display:block;font:400 11px 'DM Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--t) 70%,#fff);margin:6px 0 12px}
.body .row{color:color-mix(in srgb,var(--t) 82%,#fff)}
.body .row b{color:var(--t)}
.body .tags span{background:color-mix(in srgb,var(--c) 60%,#fff);color:var(--t)}
.what{margin:0 0 12px;font:500 21px/1.2 'Cormorant Garamond',Georgia,serif}
.row{margin:6px 0 0;color:var(--muted);font-size:14px}
.row b{color:var(--ink);font:500 11px 'DM Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tags span{background:color-mix(in srgb,var(--c) 40%,var(--card));color:var(--ink);padding:4px 11px;border-radius:999px;font:400 11.5px 'DM Mono',ui-monospace,monospace;letter-spacing:.02em}
.empty{padding:40px 0;color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
</style>
</head>
