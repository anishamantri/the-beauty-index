<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Beauty Index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f7f2f3;--ink:#2b2226;--muted:#6f6269}
@media (prefers-color-scheme:dark){:root{--bg:#1a1417;--ink:#f4eaee;--muted:#b3a3aa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
header,main{max-width:1000px;margin:0 auto;padding:0 20px}
header{padding-top:56px;padding-bottom:24px}
h1{font:600 clamp(46px,10vw,84px)/.95 'Cormorant Garamond',Georgia,serif;margin:0 0 14px;letter-spacing:.01em}
header p{margin:0;max-width:44ch;color:var(--muted);font:italic 500 22px/1.35 'Cormorant Garamond',Georgia,serif}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding-bottom:64px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;min-height:240px;padding:22px;border-radius:28px;color:#2a1f25;text-decoration:none;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 40%,#fff),var(--c))}
.tile h2{margin:0 0 6px;font:600 32px/1 'Cormorant Garamond',Georgia,serif}
.tile span{font:400 11px 'DM Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
a.tile:hover{transform:translateY(-3px);transition:transform .2s}
a.tile:focus-visible{outline:3px solid #e0527a;outline-offset:3px}
.soon{opacity:.6}
@media (prefers-reduced-motion:reduce){a.tile:hover{transform:none}}
</style>
</head>
<body>
<header>
<h1>The Beauty Index</h1>
<p>A little science, a little vanity. Pretty pages for skin, makeup, hair and looks.</p>
</header>
<main>
<a class="tile" style="--c:#f4c6d4" href="pretty-chemistry.html"><h2>Pretty Chemistry</h2><span>Skincare ingredients</span></a>
<div class="tile soon" style="--c:#d4e6f7"><h2>Skin Treatments</h2><span>Coming soon</span></div>
<div class="tile soon" style="--c:#fbd9c2"><h2>Makeup</h2><span>Coming soon</span></div>
<div class="tile soon" style="--c:#e4d7f5"><h2>Hair Concepts</h2><span>Coming soon</span></div>
<div class="tile soon" style="--c:#d9e8c4"><h2>Looks</h2><span>Coming soon</span></div>
</main>
</body>
</html>
